<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Familien-Abendessen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet">
<style>
/* VOICE: warm, praktisch, familiär – ein Küchenzettel, kein Dashboard
   IDEA: der Wochenzettel am Kühlschrank, vier Abende untereinander
   PICTURE: die vier Abend-Karten selbst, mit großen hängenden Tagesnamen
   COLOUR and TYPE: Aubergine-Kopf, weißes Papier, Tomatenrot als Akzent, Senf als Stütze; Young Serif + Figtree
   LAYOUT: Kopfband mit Wochenwahl, Reiter, eine ruhige Spalte bis 760px */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#17121a);--ink:light-dark(#22161f,#f3ecef);--soft:light-dark(#6d5a66,#b9a8b2);
--head:light-dark(#3b1f3a,#2a1529);--headink:#fbf3f6;--card:light-dark(#fbf8f9,#221a24);--line:light-dark(#e9dfe4,#3a2e3b);
--tom:light-dark(#d93d25,#ff6a4d);--mus:light-dark(#f2b230,#e0a425);--veg:light-dark(#2f7d4f,#6fcf94);--chip:light-dark(#f1e9ed,#2f2430)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip}
h1,h2,.day b,.dish{font-family:"Young Serif",Georgia,serif;font-weight:400}
header{background:var(--head);color:var(--headink);padding:8px max(5vw,16px) 10px;position:sticky;top:0;z-index:5}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:clamp(30px,6vw,44px);line-height:1.05;margin:0 0 6px}
.wk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.wk span{font-weight:600;font-size:17px;flex:1}
.wk small{display:block;font-weight:400;opacity:.75;font-size:14px}
button,select,input,textarea{font:inherit;font-size:16px}
button{cursor:pointer;border:0;border-radius:10px;min-height:44px;padding:0 14px;background:var(--chip);color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--mus);outline-offset:2px}
.ghost{font-size:26px;line-height:1;background:rgba(255,255,255,.12);color:var(--headink);min-width:44px}
.pri{background:var(--tom);color:#fff;font-weight:600}
main{padding:20px max(5vw,16px) 48px}
.note{font-size:14px;color:var(--soft);margin:0 0 14px}
.err{background:light-dark(#fde8e4,#3a1712);color:var(--tom);padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:15px}
.day{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:4px 14px;padding:18px 0;border-bottom:1px dashed var(--line)}
.day b{font-size:26px;line-height:1.1;color:var(--tom)}
.day b small{display:block;font:600 13px Figtree,sans-serif;color:var(--soft);margin-top:4px}
.dish{font-size:22px;line-height:1.2;margin:0 0 8px}
.dish.empty{color:var(--soft);font-style:italic;font-family:Figtree,sans-serif;font-size:17px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row select{flex:1 1 200px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px}
.ppl{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.p{min-height:36px;padding:0 12px;border-radius:99px;font-size:14px;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--soft)}
.p.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.p.on.v{background:var(--veg);border-color:var(--veg);color:#fff}
.meta{font-size:14px;color:var(--soft)}
.warn{color:var(--tom);font-weight:600;font-size:14px;margin-top:6px}
.ok{color:var(--veg);font-weight:600;font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;align-items:center}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list input[type=checkbox]{width:24px;height:24px;accent-color:var(--tom);flex:none}
.list label{flex:1;display:flex;gap:10px;align-items:baseline;cursor:pointer}
.list .q{margin-left:auto;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.list li.done label{text-decoration:line-through;color:var(--soft)}
.list .from{font-size:13px;color:var(--soft)}
.add{display:flex;gap:8px;margin:16px 0}
.add input,.f input,.f select,.f textarea{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 10px}
h2{font-size:24px;line-height:1.1;margin:26px 0 8px}
.rc{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.rc .dish{margin:0;font-size:20px}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--chip);margin:4px 4px 0 0}
.tag.v{background:var(--veg);color:#fff}
.wf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px;margin:8px 0 6px}
.wf select,.wf input{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px;width:100%}
.wf input,.wf button,.wf #wday{grid-column:1/-1}
.wish{padding:12px 0;border-bottom:1px solid var(--line)}
.wish p{margin:0 0 8px;font-size:17px}.wish p b{color:var(--tom)}
.wish.done p{color:var(--soft);text-decoration:line-through}
.idea{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.idea p.dish{margin:0 0 4px;font-size:20px}.idea p{margin:4px 0;font-size:15px}
.vote{margin:10px 0 4px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.vsum{width:100%;text-align:left;background:transparent;padding:0;min-height:44px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px}.day .vsum b{color:var(--tom);font:700 15px Figtree,system-ui,sans-serif}.vsum span:last-child{white-space:nowrap;font-weight:600;color:var(--soft)}
.vc{padding:8px 0;border-bottom:1px dashed var(--line)}.vc:last-of-type{border-bottom:0}
.vc .top{display:flex;justify-content:space-between;gap:8px;font-weight:600}.vc .top span:last-child{white-space:nowrap}.vc.lead .top{color:var(--tom)}
.vc .ppl{margin:6px 0 0}.vc .p{min-height:32px;font-size:13px}
.chat{display:grid;gap:6px;margin:6px 0 8px}.chat:empty{display:none}
.msg{padding:8px 12px;border-radius:14px;max-width:88%;font-size:15px;line-height:1.4;white-space:pre-wrap}
.msg.u{justify-self:end;background:var(--ink);color:var(--bg)}.msg.a{justify-self:start;background:var(--chip)}.msg.w{color:var(--soft);font-style:italic}
#chatin{flex:1 1 220px;min-height:64px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 10px}
.ov{position:fixed;inset:0;background:rgba(20,10,20,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;z-index:9}
.ov.on{display:flex}
.f{background:var(--bg);border-radius:16px;padding:20px;width:min(640px,100%)}
.f label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.f textarea{width:100%;min-height:90px}
.ing{display:grid;grid-template-columns:minmax(0,1fr) 5.2em 5.2em 7.5em 44px;gap:6px;margin-bottom:6px}
.ing input,.ing select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 8px;width:100%}
@media(max-width:600px){.day{grid-template-columns:minmax(0,1fr)}.day b small{display:inline;margin-left:8px}
.ing{grid-template-columns:minmax(0,1fr) 4.4em 5.6em;}.ing select.t{grid-column:1/3}}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.wk{margin:0 0 6px}.wk span{text-align:center}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}.strip:empty{display:none}
.strip button{background:transparent;color:var(--headink);min-height:40px;padding:2px 0;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:10px}
.strip button i{width:10px;height:10px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);display:block}
.strip button.s-ok i{background:#6fcf94;border-color:#6fcf94}.strip button.s-vote i{background:var(--mus);border-color:var(--mus)}.strip button.s-warn i{background:#ff6a4d;border-color:#ff6a4d}
.bn{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--bg);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bn a{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;justify-content:center;color:var(--soft);text-decoration:none;font-size:12px;font-weight:600;border-radius:12px}
.bn a i{font-size:23px;line-height:1}.bn a.on{color:var(--tom)}
.bd{position:absolute;top:2px;left:calc(50% + 6px);background:var(--tom);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:0 6px;line-height:17px;min-width:18px;text-align:center}.bd:empty{display:none}
.day{display:block;padding:0;border-bottom:1px solid var(--line)}
.dr{display:block}
.dh{width:100%;display:flex;align-items:center;gap:12px;background:transparent;text-align:left;padding:12px 0 6px;min-height:52px;border-radius:0}
.dn{width:62px;flex:none;font:400 20px/1 "Young Serif",Georgia,serif;color:var(--tom)}.dn small{display:block;font:600 12px Figtree,sans-serif;color:var(--soft);margin-top:4px}
.ds{flex:1;min-width:0;font-size:17px;font-weight:600;line-height:1.25}.ds small{display:block;font-size:13px;font-weight:400;color:var(--soft);margin-top:2px}
.ds.empty{color:var(--soft);font-weight:400;font-style:italic}.ds .w{color:var(--tom);font-weight:600}
.av{display:flex;gap:6px;margin:0 0 12px 74px;flex-wrap:wrap}
.av button{width:30px;height:30px;min-height:30px;padding:0;border-radius:50%;font-size:12px;font-weight:700;background:transparent;border:1.5px solid var(--line);color:var(--soft)}
.av button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}.av button.on.v{background:var(--veg);border-color:var(--veg);color:#fff}
.day.open .dh .ds small{display:none}
.dx{padding:0 0 16px}
.day.open{background:var(--card);margin:0 calc(-1*max(5vw,16px));padding:0 max(5vw,16px)}
.cat{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--soft);margin:18px 0 2px}.cat i{font-size:18px}
@media(max-width:360px){.dn{width:52px;font-size:18px}.av{margin-left:64px}}
@media(prefers-reduced-motion:no-preference){.day,.rc,.list li{animation:in .25s ease both}@keyframes in{from{opacity:0;transform:translateY(4px)}}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="wk">
    <button class="ghost" id="prev" aria-label="Vorige Woche">‹</button>
    <span id="wklabel">…</span>
    <button class="ghost" id="next" aria-label="Nächste Woche">›</button>
  </div>
  <div id="strip" class="strip"></div>
</div></header>
<main><div class="wrap">
  <div id="msg"></div>
  <section id="v-woche"></section>
  <section id="v-einkauf" hidden></section>
  <section id="v-wuensche" hidden></section>
  <section id="v-rezepte" hidden></section>
</div></main>
<nav class="bn" aria-label="Bereiche"><a href="#woche" data-t="woche"><i class="ti ti-calendar-week" aria-hidden="true"></i>Woche<span class="bd" id="b-woche"></span></a><a href="#einkauf" data-t="einkauf"><i class="ti ti-shopping-cart" aria-hidden="true"></i>Einkauf<span class="bd" id="b-einkauf"></span></a><a href="#wuensche" data-t="wuensche"><i class="ti ti-heart" aria-hidden="true"></i>Wünsche<span class="bd" id="b-wuensche"></span></a><a href="#rezepte" data-t="rezepte"><i class="ti ti-chef-hat" aria-hidden="true"></i>Rezepte<span class="bd" id="b-rezepte"></span></a></nav>
<div class="ov" id="ov"><form class="f" id="rf"></form></div>
<script>
{
const ALLDAYS=[['mo','Montag'],['di','Dienstag'],['mi','Mittwoch'],['do','Donnerstag'],['fr','Freitag'],['sa','Samstag'],['so','Sonntag']];
let PEOPLE=[],DAYS=ALLDAYS.slice(0,4).map((d,i)=>[...d,i]),CFG={};
const UNITS=['g','ml','Stk','EL','TL','Pck','Bund','Prise'];
const TYPES={all:'für alle',meat:'Fleisch',veg:'veg. Ersatz'};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=n=>n.toLocaleString('de-DE',{maximumFractionDigits:1});
let docs={},recipes=[],plan={days:{}},prevPlan={days:{}},shop={checked:{},extras:[]},settings={kidFactor:0.6};
let rev='',pending=0,stale=false,loaded=false;
let wishes=[],ki=false,ideas=[],ideaMsg='',busy=false,pendingWish=null;

// ---- Kalenderwoche ----
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();return{y,w:Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7)}}
const wid=m=>{const{y,w}=isoWeek(m);return y+'-W'+String(w).padStart(2,'0')};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=new Date();
let mon=mondayOf([0,5,6].includes(today.getDay())?add(today,7):today);
const dfmt=d=>d.toLocaleDateString('de-DE',{day:'numeric',month:'short'});

// ---- Wer isst mit (Muster) ----
function initials(){const f=p=>p.n.trim().charAt(0).toUpperCase();for(const p of PEOPLE){const same=PEOPLE.filter(q=>f(q)===f(p)).length>1;p.ini=same?p.n.trim().slice(0,2):f(p)}}
function present(rules,k,even){return rules.some(([wk,days])=>(wk==='immer'||(wk==='gerade')===even)&&(!days||days.includes(k)))}
function parseRules(s){s=String(s||'').toLowerCase().trim();if(!s||s==='nie')return[];return s.split(';').map(x=>x.trim()).filter(Boolean).map(x=>{let wk='immer',days=null;for(const t of x.split(/\s+/)){if(['immer','gerade','ungerade'].includes(t))wk=t;else days=t.split(',').map(d=>d.trim().slice(0,2)).filter(Boolean)}return[wk,days]})}
function defAtt(k,m=mon){const even=isoWeek(m).w%2===0,o={};for(const p of PEOPLE)o[p.id]=present(p.rules,k,even);return o}
function fixedFor(k){
  const off=ALLDAYS.findIndex(d=>d[0]===k),att=attOf(k),all=PEOPLE.length&&PEOPLE.every(p=>att[p.id]);
  for(const f of CFG.feste||[]){const tage=[].concat(f.tag||[]);if(!tage.includes(k)||!f.gericht)continue;const w=[].concat(f.wenn||['immer']);
    if(w.includes('immer'))return f.gericht;if(!all)continue;
    if(w.includes('alle_erster_im_monat')){const d=add(mon,off);let first=true;for(let x=add(d,-7);x.getMonth()===d.getMonth();x=add(x,-7)){const a=defAtt(k,mondayOf(x));if(PEOPLE.every(p=>a[p.id])){first=false;break}}if(first)return f.gericht;continue}
    if(w.includes('alle'))return f.gericht}
  return null}
const fixedRecipe=n=>n?recipes.find(r=>String(r.name).toLowerCase()===String(n).toLowerCase()):null;
const effR=k=>rById(dayOf(k).r)||fixedRecipe(fixedFor(k));
const lastOff=()=>DAYS.length?DAYS[DAYS.length-1][2]:3;
const dayOf=k=>plan.days?.[k]||{};
const attOf=k=>({...defAtt(k),...(dayOf(k).att||{})});
function portions(att){let tot=0,veg=0;for(const p of PEOPLE)if(att[p.id]){const f=p.kid?+settings.kidFactor||0.6:1;tot+=f;if(p.veg)veg+=f}return{tot,veg,meat:tot-veg}}
const rById=id=>recipes.find(r=>r.id===id);
const hasMeat=r=>(r.ing||[]).some(x=>x.t==='meat');
const hasAlt=r=>(r.ing||[]).some(x=>x.t==='veg');
const fits=(r,att)=>!hasMeat(r)||hasAlt(r)||!PEOPLE.some(p=>p.veg&&att[p.id]);

// ---- Speichern (eine Schreibung pro Dokument zur Zeit) ----
async function api(method,path,body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Fehler '+r.status));return d}
const queue={};
function write(path,fn){pending++;queue[path]=(queue[path]||Promise.resolve()).then(fn).catch(e=>msg('Speichern fehlgeschlagen: '+e.message)).finally(()=>{if(--pending===0){rev='';poll()}})}
function save(path,data){docs[path]=data;derive();write(path,()=>api('PUT','api/doc/'+path,data))}
function del(path){delete docs[path];derive();render();write(path,()=>api('DELETE','api/doc/'+path))}
function msg(t){$('#msg').innerHTML=t?'<div class="err">'+esc(t)+'</div>':''}
function markWishes(ids){for(const w of wishes)if(!w.done&&w.r&&ids.includes(w.r)){const{id,...d}=w;save('wishes/'+id,{...d,done:true,week:wid(mon)})}}
function voteCands(k,taken=[]){const att=attOf(k),wk=wid(mon),out=[];const ok=id=>{const x=rById(id);return x&&fits(x,att)&&!out.includes(id)&&!taken.includes(id)};
  for(const w of wishes)if(!w.done&&w.r&&w.day===k&&w.week===wk&&ok(w.r))out.push(w.r);
  return out}
function decide(k){const d=dayOf(k),c=d.cands||[],v=d.votes||{},n={};for(const id of c)n[id]=0;for(const id of Object.values(v))if(id in n)n[id]++;
  const max=Math.max(0,...Object.values(n));let tied=c.filter(id=>n[id]===max);const wished=new Set(wishes.filter(w=>!w.done).map(w=>w.r));
  const tw=tied.filter(id=>wished.has(id));if(tw.length)tied=tw;return tied[Math.floor(Math.random()*tied.length)]}
function setDay(k,patch){plan={days:{...plan.days,[k]:{...dayOf(k),...patch}}};save('plans/'+wid(mon),plan);if(patch.r)markWishes([patch.r]);render()}

// ---- Woche ----
function recipeOptions(sel,att,fx){
  const ok=recipes.filter(r=>fits(r,att)),no=recipes.filter(r=>!fits(r,att));
  const o=r=>`<option value="${esc(r.id)}"${r.id===sel?' selected':''}>${esc(r.name)}</option>`;
  return `<option value="">${fx?'Fester Abend: '+esc(fx):'– Gericht wählen –'}</option>${ok.map(o).join('')}${no.length?`<optgroup label="Nicht vegetarisch">${no.map(o).join('')}</optgroup>`:''}`}
const dOpen=new Set();
function dayInfo(k){const d=dayOf(k),att=attOf(k),fx=rById(d.r)?null:fixedFor(k),r=effR(k),vegIn=PEOPLE.filter(x=>x.veg&&att[x.id]);
  const voting=!!(d.voting||d.cands?.length),bad=r&&!fits(r,att);
  return{d,att,fx,r,vegIn,voting,bad,st:bad?'s-warn':(r||fx)?'s-ok':voting?'s-vote':''}}
function voteSummary(d,att){const v=d.votes||{},n={};for(const id of Object.values(v))n[id]=(n[id]||0)+1;const max=Math.max(0,...Object.values(n));
  const lead=(d.cands||[]).filter(id=>max&&n[id]===max).map(id=>rById(id)?.name).filter(Boolean),left=PEOPLE.filter(p=>att[p.id]&&!v[p.id]).map(p=>p.n);
  const c=(d.cands||[]).length;return (lead.length?`${lead.join(' / ')} vorne (${max})`:c?`${c} ${c===1?'Gericht':'Gerichte'}, noch keine Stimme`:'noch keine Gerichte')+(left.length&&!locked()?` · fehlt: ${left.join(', ')}`:'')}
function renderWeek(){
  const h=DAYS.map(([k,name,o])=>{
    const{d,att,fx,r,vegIn,voting,bad}=dayInfo(k),p=portions(att),open=dOpen.has(k),n=PEOPLE.filter(x=>att[x.id]).length;
    let title,sub,empty=false;
    if(fx||r){title=esc(fx||r.name)+(fx?' <span class="tag">fest</span>':'')+(d.auto&&r&&!fx?' <span class="tag">Abstimmung</span>':'');
      sub=bad?`<span class="w">Nicht vegetarisch – ${esc(vegIn.map(x=>x.n).join(' und '))} essen mit</span>`:fx&&!r?`${n} Personen · kein Einkauf`:`${nf(p.tot)} Portionen${r&&hasMeat(r)&&vegIn.length?' · mit Veggie-Variante':''}`}
    else if(voting){title='Abstimmung läuft';sub=esc(voteSummary(d,att))}

function fillForm(x){$('#rn').value=x.name;$('#rt').value=x.tags.join(', ');$('#ings').innerHTML=x.ing.map(ingRow).join('');$('#rs').value=x.steps}
function renderChat(wait){const l=$('#chatlog');if(!l)return;l.innerHTML=chat.map(m=>`<div class="msg ${m.role==='user'?'u':'a'}">${esc(m.text)}</div>`).join('')+(wait?'<div class="msg a w">Die KI passt das Rezept an …</div>':'')}
async function chatSend(b){const inp=$('#chatin'),t=inp.value.trim();if(!t)return;const cur=formRecipe();
  if(!cur.name&&!cur.ing.length){chat.push({role:'ai',text:'Bitte zuerst einen Titel eingeben oder das Rezept ausfüllen lassen.'});renderChat();return}
  chat.push({role:'user',text:t});inp.value='';b.disabled=true;renderChat(true);
  const hist=chat.slice(0,-1).slice(-8).map(m=>(m.role==='user'?'Nutzer: ':'Du: ')+m.text).join('\n');
  try{const res=await kiJson(`${RULES()}\nAktuelles Rezept als JSON:\n${JSON.stringify(cur)}\n${hist?'Bisheriger Verlauf:\n'+hist+'\n':''}Neue Bitte des Nutzers: ${t}\nPasse das Rezept entsprechend an (Zutaten, Mengen, Zubereitung; Namen nur ändern, wenn es nötig ist oder gewünscht wird). Antworte nur mit einem JSON-Objekt dieser Form: {"reply":"1–2 Sätze auf Deutsch, was du geändert hast","recipe":${FMT}}`);
    const x=clean(res?.recipe||res);if(!x)throw new Error('Kein brauchbares Rezept bekommen');
    if(!$('#ov').classList.contains('on'))return;fillForm(x);chat.push({role:'ai',text:String(res?.reply||'Rezept angepasst.').slice(0,500)})}
  catch(e){chat.push({role:'ai',text:sErr(e)})}
  finally{b.disabled=false;renderChat()}}
async function kiFill(b){const name=$('#rn').value.trim(),st=$('#kistat');if(!name){st.textContent='Bitte erst einen Titel eingeben.';$('#rn').focus();return}
  b.disabled=true;st.textContent='Die KI schreibt das Rezept …';
  try{const x=await aiRecipe(name);if(!$('#ov').classList.contains('on'))return;fillForm({...x,name});st.textContent='Fertig – bitte prüfen und speichern.'}
  catch(e){st.textContent=sErr(e)}finally{b.disabled=false}}
async function recipeFromWish(id,b){const w=wishes.find(x=>x.id===id);if(!w||!ki)return;b.disabled=true;b.textContent='KI schreibt …';
  try{const x=clean(await kiJson(`${RULES()}\nSchreibe ein Rezept für: "${w.text}". Antworte nur mit einem JSON-Objekt dieser Form: ${FMT}`));
    if(!x)throw{code:'invalid_json'};pendingWish=id;openRecipe({id:'',...x});pendingWish=id}
  catch(e){b.disabled=false;b.textContent='Rezept per KI';msg(sErr(e))}}

// ---- Darstellung & Reiter ----
function tab(){return['woche','einkauf','wuensche','rezepte'].includes(location.hash.slice(1))?location.hash.slice(1):'woche'}
function render(){
  const{w}=isoWeek(mon);$('#wklabel').innerHTML=`KW ${w} <small>${dfmt(mon)} – ${dfmt(add(mon,lastOff()))} · ${w%2?'ungerade':'gerade'} Woche</small>`;
  const t=tab();document.querySelectorAll('.bn a').forEach(a=>{a.classList.toggle('on',a.dataset.t===t);a.setAttribute('aria-current',a.dataset.t===t?'page':'false')});
  $('#strip').innerHTML=DAYS.map(([k,n])=>{const s=dayInfo(k).st;return `<button class="${s}" data-strip="${k}" aria-label="${n}: ${s==='s-ok'?'geplant':s==='s-vote'?'Abstimmung läuft':s==='s-warn'?'passt nicht':'offen'}">${n.slice(0,2)}<i></i></button>`}).join('');
  const sh=shopItems(),ch=shop.checked||{},nv=DAYS.filter(([k])=>dayInfo(k).voting).length,ns=sh.filter(x=>!ch[x.key]).length+(shop.extras||[]).filter(x=>!x.done).length,nw=wishes.filter(w=>!w.done).length;
  $('#b-woche').textContent=nv||'';$('#b-einkauf').textContent=ns||'';$('#b-wuensche').textContent=nw||'';
  for(const v of['woche','einkauf','wuensche','rezepte'])$('#v-'+v).hidden=v!==t;
  renderWeek();renderShop();renderWishes();renderRecipes()}
addEventListener('hashchange',render);

// ---- Ereignisse ----
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.k)setDay(t.dataset.k,{r:t.value||null,auto:null});
  else if(t.dataset.addc){if(t.value){const k=t.dataset.addc;setDay(k,{cands:[...(dayOf(k).cands||[]),t.value]})}}
  else if(t.dataset.wplan){const w=wishes.find(x=>x.id===t.dataset.wplan);if(w&&t.value)setDay(t.value,{r:w.r})}
  else if(t.id==='kf'){settings={...settings,kidFactor:parseFloat(t.value.replace(',','.'))};save('settings/main',settings);render()}
  else if(t.dataset.ck){shop={...shop,checked:{...shop.checked,[t.dataset.ck]:t.checked}};save('shop/'+wid(mon),shop);render()}
  else if(t.dataset.ex){shop={...shop,extras:(shop.extras||[]).map(x=>x.id===t.dataset.ex?{...x,done:t.checked}:x)};save('shop/'+wid(mon),shop);render()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.att){const k=b.dataset.att,a=attOf(k);a[b.dataset.p]=!a[b.dataset.p];setDay(k,{att:a})}
  else if(b.dataset.sug){const k=b.dataset.sug,id=suggest(k);if(id)setDay(k,{r:id})}
  else if(b.id==='fill'){const days={...plan.days},taken=[];DAYS.forEach(([k])=>{if(!days[k]?.r&&!fixedFor(k)){const id=suggest(k,taken);if(id){taken.push(id);days[k]={...days[k],r:id}}}});plan={days};save('plans/'+wid(mon),plan);markWishes(taken);render()}
  else if(b.dataset.dopen){const k=b.dataset.dopen;dOpen.has(k)?dOpen.delete(k):dOpen.add(k);render()}
  else if(b.dataset.strip){const k=b.dataset.strip;if(tab()!=='woche')location.hash='#woche';dOpen.add(k);render();document.getElementById('day-'+k)?.scrollIntoView({behavior:'smooth',block:'center'})}
  else if(b.dataset.vclose){dOpen.delete(b.dataset.vclose);render()}
  else if(b.dataset.startvote){const k=b.dataset.startvote;setDay(k,{voting:true,cands:voteCands(k),votes:{}})}
  else if(b.dataset.vote){if(locked())return;const k=b.dataset.vote,v={...(dayOf(k).votes||{})};if(v[b.dataset.p]===b.dataset.c)delete v[b.dataset.p];else v[b.dataset.p]=b.dataset.c;setDay(k,{votes:v})}
  else if(b.dataset.decide){const k=b.dataset.decide,id=decide(k);if(id)setDay(k,{r:id,cands:null,votes:null,voting:null})}
  else if(b.dataset.endvote)setDay(b.dataset.endvote,{cands:null,votes:null,voting:null});
  else if(b.id==='kifill')kiFill(b);
  else if(b.id==='chatsend')chatSend(b);
  else if(b.id==='ideas')getIdeas();
  else if(b.id==='impb'){let n=0;try{let v=parseJSON($('#imp').value);for(const x of(Array.isArray(v)?v:[v]).map(clean).filter(Boolean)){save('recipes/'+slug(x.name),{name:x.name,tags:x.tags,steps:x.steps,ing:x.ing});n++}$('#impm').textContent=n?n+' Rezept(e) importiert':'Nichts Brauchbares gefunden';if(n)$('#imp').value=''}catch(e){$('#impm').textContent=e.message}}
  else if(b.id==='todo'){const ch=shop.checked||{};const items=shopItems().filter(x=>!ch[x.key]).map(x=>`${x.n} (${fmtQ(x.q,x.u)})`).concat((shop.extras||[]).filter(x=>!x.done).map(x=>x.t));b.disabled=true;api('POST','api/todo',{items}).then(d=>{b.textContent=d.added+' Einträge übernommen'},e=>{b.disabled=false;msg(e.message)})}
  else if(b.dataset.take){const x=ideas[+b.dataset.take];if(x&&!x.added){save('recipes/'+slug(x.name),{name:x.name,tags:x.tags,steps:x.steps,ing:x.ing});x.added=true;render()}}
  else if(b.dataset.wclaude)recipeFromWish(b.dataset.wclaude,b);
  else if(b.dataset.wself){const w=wishes.find(x=>x.id===b.dataset.wself);if(w){pendingWish=w.id;openRecipe({id:'',name:w.text,tags:[],steps:'',ing:[{}]})}}
  else if(b.dataset.wdel)del('wishes/'+b.dataset.wdel)
  else if(b.id==='prev'||b.id==='next'){mon=add(mon,b.id==='prev'?-7:7);rev='';derive();render();poll()}
  else if(b.dataset.exdel){shop={...shop,extras:(shop.extras||[]).filter(x=>x.id!==b.dataset.exdel)};save('shop/'+wid(mon),shop);render()}
  else if(b.id==='reset'){shop={...shop,checked:{},extras:(shop.extras||[]).map(x=>({...x,done:false}))};save('shop/'+wid(mon),shop);render()}
  else if(b.id==='copy'){const ch=shop.checked||{},g={};for(const x of shopItems().filter(x=>!ch[x.key])){const c=catOf(x.n);(g[c[0]]=g[c[0]]||[c[1]]).push(`- ${x.n}: ${fmtQ(x.q,x.u)}`)}const ex=(shop.extras||[]).filter(x=>!x.done).map(x=>'- '+x.t);const txt=CORDER.filter(k=>g[k]).map(k=>g[k].join('\n')).concat(ex.length?['Extra\n'+ex.join('\n')]:[]).join('\n\n');navigator.clipboard?.writeText(txt).then(()=>{b.textContent='Kopiert'},()=>{b.textContent='Kopieren nicht möglich'})}
  else if(b.id==='newr')openRecipe();
  else if(b.dataset.edit)openRecipe(rById(b.dataset.edit));
  else if(b.id==='addi')$('#ings').insertAdjacentHTML('beforeend',ingRow());
  else if(b.classList.contains('del'))b.closest('.ing').remove();
  else if(b.id==='cancel')closeR();
  else if(b.id==='rdel')$('#rdelq').hidden=false;
  else if(b.id==='rdelyes'){del('recipes/'+$('#rf').dataset.id);closeR()}});
document.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='exf'){const v=$('#ext').value.trim();if(!v)return;shop={...shop,extras:[...(shop.extras||[]),{id:Date.now().toString(36),t:v,done:false}]};save('shop/'+wid(mon),shop);render();$('#ext').focus()}
  if(e.target.id==='rf'){
    const ing=[...document.querySelectorAll('#ings .ing')].map(r=>({n:r.querySelector('.n').value.trim(),q:parseFloat(r.querySelector('.q').value)||0,u:r.querySelector('.u').value,t:r.querySelector('.t').value})).filter(x=>x.n);
    const data={name:$('#rn').value.trim(),tags:$('#rt').value.split(',').map(s=>s.trim()).filter(Boolean),steps:$('#rs').value,ing};
    if(!data.name)return;let id=$('#rf').dataset.id;
    if(!id)id=slug(data.name);
    save('recipes/'+id,data);
    if(pendingWish){const w=wishes.find(x=>x.id===pendingWish);if(w){const{id:wi,...d}=w;save('wishes/'+wi,{...d,r:id})}pendingWish=null}
    closeR()}
  if(e.target.id==='wf'){const who=$('#wwho').value,r=$('#wr').value,t=$('#wt').value.trim();if(!r&&!t)return;
    const id=Date.now().toString(36);const day=$('#wday').value||null;if(day&&r){const dd=dayOf(day);if((dd.voting||dd.cands?.length)&&!locked()&&!(dd.cands||[]).includes(r)&&fits(rById(r)||{},attOf(day)))setDay(day,{cands:[...(dd.cands||[]),r]})}save('wishes/'+id,{who,r:r||null,text:r?(rById(r)?.name||''):t,done:false,at:new Date().toISOString(),day,week:day?wid(mon):null});$('#wt').value='';$('#wr').value=''}});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeR()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeR()});

// ---- Daten (Home Assistant App) ----
let me='';
function derive(){
  const all=Object.entries(docs),get=p=>docs[p];
  recipes=all.filter(([p])=>p.startsWith('recipes/')).map(([p,d])=>({id:p.slice(8),...d})).sort((a,b)=>String(a.name).localeCompare(String(b.name),'de'));
  wishes=all.filter(([p])=>p.startsWith('wishes/')).map(([p,d])=>({id:p.slice(7),...d})).sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  settings={kidFactor:+CFG.kinderportion||0.6,...(get('settings/main')||{})};
  plan={days:{},...(get('plans/'+wid(mon))||{})};prevPlan={days:{},...(get('plans/'+wid(add(mon,-7)))||{})};
  shop={checked:{},extras:[],...(get('shop/'+wid(mon))||{})}}
const typing=()=>{const a=document.activeElement;return $('#ov').classList.contains('on')||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))};
async function poll(){if(pending)return;
  try{const d=await api('GET',`api/state?since=${rev}&week=${wid(mon)}&week=${wid(add(mon,-7))}`);if(pending)return;
    if(!loaded){loaded=true;msg('')}
    if(!d.same){rev=String(d.rev);docs=d.docs||{};derive();if(typing())stale=true;else render()}}
  catch(e){msg('Keine Verbindung zum Mahlzeit-Planer.')}}
document.addEventListener('focusout',()=>setTimeout(()=>{if(stale&&!typing()){stale=false;render()}},50));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
(async()=>{
  try{CFG=await api('GET','api/config')}catch(e){msg('Einstellungen nicht erreichbar: '+e.message)}
  const used=new Set();
  PEOPLE=(CFG.personen||[]).map(p=>{let id=String(p.name||'p').toLowerCase().replace(/[^a-z0-9äöüß]+/g,'-').slice(0,30)||'p';while(used.has(id))id+='-';used.add(id);return{id,n:String(p.name||''),kid:!!p.kind,veg:!!p.vegetarisch,rules:parseRules(p.muster)}});
  const tage=String(CFG.tage||'mo,di,mi,do').toLowerCase().split(',').map(s=>s.trim().slice(0,2));
  DAYS=ALLDAYS.map((d,i)=>[...d,i]).filter(d=>tage.includes(d[0]));if(!DAYS.length)DAYS=ALLDAYS.slice(0,4).map((d,i)=>[...d,i]);
  initials();ki=!!CFG.ki;const u=String(CFG.user||'').toLowerCase();me=(PEOPLE.find(p=>u&&(u===p.n.toLowerCase()||u.startsWith(p.n.toLowerCase())))||{}).id||'';
  derive();render();await poll();setInterval(()=>{if(!document.hidden)poll()},5000)})();
}
</script>
