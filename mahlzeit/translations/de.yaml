configuration:
  personen:
    name: Personen
    description: >-
      Wer am Tisch sitzt. muster sagt, wann jemand da ist: "immer", "gerade", "ungerade",
      optional mit Tagen, mehrere Regeln mit ";" getrennt, z. B. "immer di,do; gerade fr,sa,so".
      Leer oder "nie" = nur von Hand.
  tage:
    name: Geplante Tage
    description: Wochentage im Plan, z. B. "mo,di,mi,do" (mo di mi do fr sa so).
  feste_abende:
    name: Feste Abende
    description: >-
      Gerichte, die an einem Wochentag fest gesetzt sind. wenn: "immer", "alle" (nur wenn alle da sind)
      oder "alle_erster_im_monat" (erster solcher Tag im Monat, an dem alle da sind).
      Gibt es ein Rezept mit genau diesem Namen, kommen seine Zutaten auf die Einkaufsliste.
  kinderportion:
    name: Kinderportion
    description: Startwert, wie viel eine Kinderportion im Vergleich zu Erwachsenen ist.
  einkaufsliste:
    name: Einkaufsliste in Home Assistant
    description: To-do-Liste, in die die Einkaufsliste übernommen werden kann (leer = aus).
  samstag_versand:
    name: Samstags-Versand
    description: Samstag 9:00 nach der Abstimmung die Einkaufsliste in die To-do-Liste übernehmen und den Plan per Push schicken.
  benachrichtigen:
    name: Push an
    description: Notify-Dienste für den Samstags-Push, z. B. notify.mobile_app_gunnars_iphone.
  ki_entity:
    name: KI-Aufgaben-Entität
    description: Optional, z. B. ai_task.claude. Dann gibt es Rezept-Ideen und Rezepte zu Wünschen per KI.
