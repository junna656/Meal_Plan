name: Mahlzeit-Planer
version: "1.1.0"
slug: mahlzeit
description: Wochenplan fürs Abendessen, Rezepte, Wünsche und Einkaufsliste für die ganze Familie
url: https://github.com/junna656/meal_plan
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:silverware-fork-knife
panel_title: Abendessen
panel_admin: false
homeassistant_api: true
options:
  personen:
    - name: Erwachsene/r 1
      kind: false
      vegetarisch: false
      muster: immer
  tage: mo,di,mi,do
  feste_abende: []
  kinderportion: 0.6
  einkaufsliste: todo.einkaufsliste
  ki_entity: ""
schema:
  personen:
    - name: str
      kind: bool
      vegetarisch: bool
      muster: str
  tage: str
  feste_abende:
    - tag: list(mo|di|mi|do|fr|sa|so)
      gericht: str
      wenn: list(immer|alle|alle_erster_im_monat)
  kinderportion: float(0.2,1.5)
  einkaufsliste: str?
  ki_entity: str?
